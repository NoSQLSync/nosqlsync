[package]
name = "nosqlsync"
description = "Migrate MongoDB to PostgreSQL with a real relational schema: analyze, plan, migrate, validate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["mongodb", "postgres", "migration", "cli", "etl"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "nosqlsync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
mongodb = "3.9.1"
nosqlsync-core = { version = "0.1.1", path = "../nosqlsync-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs"] }

[dev-dependencies]
tempfile = "3"
